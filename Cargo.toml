[package]
name = "stremio-addon-core"
version = "0.1.1"
edition = "2021"
description = "Reusable Rust core for authenticated Stremio addon servers"
license = "MIT"
rust-version = "1.88"
readme = "README.md"
documentation = "https://docs.rs/stremio-addon-core"
keywords = ["stremio", "addon", "axum", "streaming"]
categories = ["web-programming::http-server"]

[dependencies]
async-trait = "0.1"
axum = "0.7"
base64 = "0.22"
hmac = "0.12"
http = "1"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "1"
time = { version = "0.3", features = ["serde"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = "0.5"
